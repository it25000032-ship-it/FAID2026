<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAID | Reports</title>
    <link rel="stylesheet" href="CSS/reports.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="Img/FaidLogo.png" alt="FAID Logo">
        </div>
        <a href="admin.php" class="back-btn">Back to Dashboard</a>
    </header>
    <main class="container">
        <div class="page-title">
            <h1>Reports</h1>
            <p>View platform statistics and reports</p>
        </div>
        <section class="filter-section">
            <h2>Generate Report</h2>
            <div class="filters">
                <div class="form-group">
                    <label for="reportType">Report Type</label>
                    <select id="reportType">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>
                <button type="button" class="generate-btn">
                    Generate Report
                </button>
            </div>
        </section>
        <section class="report-section">
            <div class="report-heading">
                <div>
                    <h2>Report Summary</h2>
                    <p>Platform performance overview</p>
                </div>
                <button type="button" class="print-btn"
                        onclick="window.print()">
                    Print Report
                </button>
            </div>
            <div class="report-info">
                <p>Report Type: <strong>Daily</strong></p>
                <p>Start Date: <strong>---</strong></p>
                <p>End Date: <strong>---</strong></p>
            </div>
            <div class="statistics">
                <div class="stat-card">
                    <p>Total Listings</p>
                    <h2>1</h2>
                </div>
                <div class="stat-card">
                    <p>Total Quantity</p>
                    <h2>1</h2>
                </div>
                <div class="stat-card">
                    <p>Total Savings</p>
                    <h2>1 IQD</h2>
                </div>
                <div class="stat-card">
                    <p>Total Purchases</p>
                    <h2>1</h2>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
