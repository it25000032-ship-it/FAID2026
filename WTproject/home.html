
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="CSS/homeStyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy and Sell</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="Img/FaidLogo.png" alt="logo" height="80" width="80">
        </div>

        <nav>
            <button type="button" aria-label="Search">&#8981;</button>

            <button type="button">
                Register
            </button>

            <button type="button">
                Sign in
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>
                    Buy and Sell<br>
                    Everything with Faid!
                </h1>
                <h2>Discover affordable products from companies 
                    with Faid. Find great deals, 
                    explore different products, and buy what 
                    you need at lower prices.</h2>

                <form action="#" method="get">
                    <input
                        type="search"
                        name="search"
                        placeholder="Search for products..."
                    >
                    <button type="submit">
                        Search
                    </button>
                </form>
            </div>

            <div class="hero-image">
                <img
                    src="Img/storehouse.jpg"
                    alt="Main image"
                >
            </div>
        </section>
    </main>
</body>
</html>
